name = "openfront-discord-bot"
main = "src/worker.ts"
compatibility_date = "2026-01-18"

# Environment variables are set via:
# wrangler secret put DISCORD_TOKEN
# wrangler secret put DISCORD_PUBLIC_KEY
# wrangler secret put DISCORD_CLIENT_ID
# wrangler secret put OWNER_DISCORD_ID
# Optional OpenFront API headers (omit to disable):
# wrangler secret put OPENFRONT_USER_AGENT
# wrangler secret put OPENFRONT_CUSTOM_HEADER_VALUE

[vars]
OPENFRONT_CUSTOM_HEADER_NAME = "x-deshack-access"

# KV namespace for posted games tracking (has native TTL support)
# Create with: wrangler kv namespace create DATA
kv_namespaces = [
  { binding = "DATA", id = "e20449398e34450cb82b29c34628a401" }
]

# D1 database for guild configuration
# Create with: wrangler d1 create openfront-bot-db
[[d1_databases]]
binding = "DB"
database_name = "openfront-bot-db"
database_id = "dc44eb75-0c1f-4720-8225-1f7aab20cb31"
migrations_dir = "migrations"

# Scheduled tasks:
# - Every 5 minutes (at :00,:05,:10…): Check for clan wins
# - Every 5 minutes offset by 2 min (at :02,:07,:12…): Check for FFA wins
# - Every minute: Process scan jobs
[triggers]
#crons = ["* * * * *", "*/5 * * * *", "2-57/5 * * * *"]
crons = ["*/5 * * * *", "2-57/5 * * * *"]

[[queues.producers]]
queue = "clan-wins-queue"
binding = "CLAN_WINS_QUEUE"

[[queues.producers]]
queue = "ffa-wins-queue"
binding = "FFA_WINS_QUEUE"

[[queues.producers]]
queue = "scan-wins-queue"
binding = "SCAN_WINS_QUEUE"

[[queues.consumers]]
queue = "clan-wins-queue"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 3
max_concurrency = 5

[[queues.consumers]]
queue = "ffa-wins-queue"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 3
max_concurrency = 5

[[queues.consumers]]
queue = "scan-wins-queue"
max_batch_size = 5
max_batch_timeout = 0
max_retries = 3
max_concurrency = 3

[observability]
[observability.logs]
enabled = true
invocation_logs = true
